<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Lifestyle</title>
  <meta name="description" content="Aufgaben, Einkauf, Finanzen und Projekte auf einem Weg durch die Stadt, offline auf deinem iPhone.">
  <meta name="theme-color" content="#e4eedf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lifestyle">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="boot" id="boot">Lifestyle</div>
  <div class="hud" id="hud"></div>

  <div class="scrim" id="scrim" data-ui></div>
  <div class="cmp" id="cmp" role="dialog" aria-label="Neuer Eintrag" data-ui></div>

  <div class="veil" id="veil" data-ui></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" data-ui></section>
  <div class="toast" id="toast" role="status" aria-live="polite" data-ui></div>

  <input type="file" id="camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="gallery" accept="image/*" hidden>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="vendor/three/three.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
